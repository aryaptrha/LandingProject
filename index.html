<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Favicon: main-icon.gif (64×64, 19 frames, 1.27 s loop) is the primary icon.
       Firefox animates GIF favicons; Chrome, Edge and Safari render frame 1 only —
       that is the purple full-grin frame, which reads on its own, so the animation is
       a bonus and never load-bearing. favicon.ico (16/32/48) is the legacy fallback
       and is also what a browser gets when it probes /favicon.ico without consulting
       this markup, so it is cut from the same artwork rather than left stale.
       sizes="any" marks the raster .ico as scalable so it isn't preferred over the
       typed GIF above.

       No sized PNG is declared next to these on purpose: an exact-size match wins
       icon negotiation in every browser, so a 32×32 PNG here would quietly make the
       GIF dead weight. icon-192.png exists only for apple-touch-icon and the
       manifest, which cannot take a GIF.

       All three are generated from assets-src/main-icon.source.gif (480×360, 2.27 MB,
       not shipped): cropped to (95, 95)–(325, 325) because the full-body framing
       dissolves into the background pattern at 16 px, then reduced to one global
       32-colour palette with dithering off. -->
  <link rel="icon" href="/main-icon.gif" type="image/gif">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Self-Hosted Web Fonts: Preloaded directly for 0-CLS instant rendering without external hops -->
  <link rel="preload" href="/fonts/pixelifysans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>


  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    content="A cozy collection of web applications, fullstack projects, backend services, and hobby games built by aryaptrha.">

    content="aryaptrha, portfolio, web developer, software engineer, game development, Unity, Next.js, Supabase, ASP.NET, fullstack, indie games">
  <meta name="author" content="aryaptrha">
  <meta name="robots" content="index, follow">
  <meta id="theme-color-meta" name="theme-color" content="#FAFAF7">

  <!-- Resolve the theme and the view mode before first paint, so a night visitor
       never sees a flash of the day palette. Mirrors the logic in
       src/composables/useTheme.ts and src/composables/useViewMode.ts; both keys must
       stay in sync with STORAGE_KEY there. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio_theme')
        var theme =
          stored === 'day' || stored === 'night'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'day'
        document.documentElement.setAttribute('data-theme', theme)
        if (theme === 'night') {
          var meta = document.getElementById('theme-color-meta')
          if (meta) meta.setAttribute('content', '#1E1C22')
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'day')
      }

      // Its own try/catch, not folded into the one above: a malformed stored theme
      // must not leave the view mode unresolved, or vice versa.
      try {
        var storedView = localStorage.getItem('portfolio_view')
        document.documentElement.setAttribute(
          'data-view',
          storedView === 'visitor' || storedView === 'dev' ? storedView : 'visitor'
        )
      } catch (e) {
        document.documentElement.setAttribute('data-view', 'visitor')
      }
    })()
  </script>

        ]
